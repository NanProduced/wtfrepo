spring:
  application:
    name: backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/wtfrepo}
    username: ${DB_USERNAME:wtfrepo}
    password: ${DB_PASSWORD:wtfrepo}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false

springdoc:
  api-docs:
    enabled: ${SPRINGDOC_ENABLED:false}
    path: /v3/api-docs
  swagger-ui:
    enabled: ${SPRINGDOC_ENABLED:false}
    path: /swagger-ui.html
    display-request-duration: true
    tags-sorter: alpha
    operations-sorter: alpha

app:
  admin:
    bootstrap:
      email: ${ADMIN_BOOTSTRAP_EMAIL:}
  shared:
    outbox:
      # Keep JPA outbox write path disabled until entity/schema review is completed.
      jpa-enabled: ${OUTBOX_JPA_ENABLED:false}
      # Relay is off by default in MVP stage; enable explicitly when Redis stream infra is ready.
      relay-enabled: ${OUTBOX_RELAY_ENABLED:false}
      relay-batch-size: ${OUTBOX_RELAY_BATCH_SIZE:100}
      relay-fixed-delay-ms: ${OUTBOX_RELAY_FIXED_DELAY_MS:1000}
      relay-max-attempts: ${OUTBOX_RELAY_MAX_ATTEMPTS:20}
      redis-stream-key: ${OUTBOX_REDIS_STREAM_KEY:wtfrepo:outbox:events}
      # Consumer group skeleton is intentionally disabled until concrete module handlers are ready.
      consumer-enabled: ${OUTBOX_CONSUMER_ENABLED:false}
      consumer-group: ${OUTBOX_CONSUMER_GROUP:wtfrepo:outbox:consumer}
      consumer-name: ${OUTBOX_CONSUMER_NAME:backend-consumer}
      consumer-batch-size: ${OUTBOX_CONSUMER_BATCH_SIZE:100}
      consumer-block-ms: ${OUTBOX_CONSUMER_BLOCK_MS:1000}
      consumer-fixed-delay-ms: ${OUTBOX_CONSUMER_FIXED_DELAY_MS:500}
      consumer-dedupe-enabled: ${OUTBOX_CONSUMER_DEDUPE_ENABLED:true}
      consumer-dedupe-retention: ${OUTBOX_CONSUMER_DEDUPE_RETENTION:30d}
      # Keep unknown event type pending by default to avoid accidental data loss.
      consumer-ack-unknown-event-type: ${OUTBOX_CONSUMER_ACK_UNKNOWN:false}
  economy:
    policy:
      # TODO(M03-economy): replace with DB + admin-published policy source of truth.
      daily-claim-amount: ${ECONOMY_DAILY_CLAIM_AMOUNT:500}
      vote-cost: ${ECONOMY_VOTE_COST:100}
      daily-game-bug-cap: ${ECONOMY_DAILY_GAME_BUG_CAP:2000}
      policy-version: ${ECONOMY_POLICY_VERSION:economy-policy-property-v1}
      policy-source: ${ECONOMY_POLICY_SOURCE:property}
  comments:
    policy:
      # TODO(M03-economy): move comment cost to unified policy center after contract freeze.
      comment-cost-bug: ${COMMENTS_COMMENT_COST_BUG:200}
      # Contract default limit for M05 publish endpoint.
      content-max-length: ${COMMENTS_CONTENT_MAX_LENGTH:4000}
      # Max unique @mentions parsed from contentMd for one comment.
      mention-max-count: ${COMMENTS_MENTION_MAX_COUNT:5}
      # Optional report message cap to keep moderation payload bounded.
      report-message-max-length: ${COMMENTS_REPORT_MESSAGE_MAX_LENGTH:500}
      # Contract default list window.
      list-default-limit: ${COMMENTS_LIST_DEFAULT_LIMIT:20}
      list-max-limit: ${COMMENTS_LIST_MAX_LIMIT:50}
      # Top Roast requires at least this many resonance votes.
      chief-conclusion-threshold: ${COMMENTS_CHIEF_CONCLUSION_THRESHOLD:10}
      # Placeholder shown for soft-deleted comments in list responses.
      deleted-placeholder: ${COMMENTS_DELETED_PLACEHOLDER:此病历已封存}
  auth:
    identity-proof:
      issuer: ${AUTH_IDENTITY_PROOF_ISSUER:wtf-repo-bff}
      audience: ${AUTH_IDENTITY_PROOF_AUDIENCE:wtf-repo-backend-auth-exchange}
      secret: ${AUTH_IDENTITY_PROOF_SECRET:change-this-identity-proof-secret-change-this}
      clock-skew: ${AUTH_IDENTITY_PROOF_CLOCK_SKEW:60s}
      max-ttl: ${AUTH_IDENTITY_PROOF_MAX_TTL:5m}
    economy:
      # TODO(M03-economy): source bootstrap grant from DB + admin-published policy center.
      # Economy module is already online; this property remains as a temporary compatibility bridge
      # for Auth token-exchange bootstrap flow until policy center is introduced.
      initial-bug-grant: ${AUTH_INITIAL_BUG_GRANT:1000}
    contract:
      oauth-state-ttl: 10m
      exchange-idempotency-ttl: 10m
      forbidden-username-keywords:
        - admin
        - manager
        - root
    rate-limit:
      exchange-limit: 30
      exchange-window: 1m
      rename-limit: 10
      rename-window: 1m
  arena:
    contract:
      battle-ttl: ${ARENA_BATTLE_TTL:10m}
      battle-id-secret: ${ARENA_BATTLE_ID_SECRET:change-this-arena-battle-id-secret}
      settlement-in-progress: ${ARENA_SETTLEMENT_IN_PROGRESS:false}
    settlement:
      enabled: ${ARENA_SETTLEMENT_ENABLED:false}
      snapshot-cron: ${ARENA_SETTLEMENT_SNAPSHOT_CRON:0 0 0 * * *}
    rate-limit:
      duel-anonymous-limit: ${ARENA_DUEL_ANON_LIMIT:60}
      duel-anonymous-window: ${ARENA_DUEL_ANON_WINDOW:1m}
      duel-authenticated-user-limit: ${ARENA_DUEL_AUTH_USER_LIMIT:120}
      duel-authenticated-user-window: ${ARENA_DUEL_AUTH_USER_WINDOW:1m}
      duel-authenticated-ip-limit: ${ARENA_DUEL_AUTH_IP_LIMIT:120}
      duel-authenticated-ip-window: ${ARENA_DUEL_AUTH_IP_WINDOW:1m}
    featured-duel:
      # TODO(M03-economy): source runtime values from admin-published policy.
      cache-key: ${ARENA_FEATURED_DUEL_CACHE_KEY:arena:duel:featured:v1}
      cache-ttl: ${ARENA_FEATURED_DUEL_CACHE_TTL:30s}
    economy:
      # TODO(M03-economy): replace with admin-published policy source when M03 is ready.
      vote-bug-cost: ${ARENA_VOTE_BUG_COST:100}
      min-bet: ${ARENA_MIN_BET:100}
      rake-rate: ${ARENA_RAKE_RATE:0.10}
      policy-version: ${ARENA_POLICY_VERSION:arena-policy-property-v1}
      policy-source: ${ARENA_POLICY_SOURCE:property}
    match:
      profile-version: ${ARENA_MATCH_PROFILE_VERSION:v1.0.0}
      species-dimension-key: ${ARENA_SPECIES_DIMENSION_KEY:species}
      diagnosis-dimension-key: ${ARENA_DIAGNOSIS_DIMENSION_KEY:diagnosis}
      same-species-score: ${ARENA_MATCH_SCORE_SAME:100}
      adjacent-species-score: ${ARENA_MATCH_SCORE_ADJACENT:60}
      cross-species-score: ${ARENA_MATCH_SCORE_CROSS:0}
      diagnosis-base-score: ${ARENA_DIAGNOSIS_BASE_SCORE:15}
      diagnosis-bonus-cap: ${ARENA_DIAGNOSIS_BONUS_CAP:30}
      cooldown-alpha: ${ARENA_MATCH_COOLDOWN_ALPHA:0.3}
      # Contract baseline: duel reads precomputed pair rows first.
      pair-first-enabled: ${ARENA_MATCH_PAIR_FIRST_ENABLED:true}
      # Keep rollback switch for staged rollout and data warm-up windows.
      runtime-pair-fallback-enabled: ${ARENA_MATCH_RUNTIME_FALLBACK_ENABLED:true}
      recent-appearance-window: ${ARENA_RECENT_APPEARANCE_WINDOW:24h}
      reset-exclude-threshold: ${ARENA_MATCH_RESET_THRESHOLD:4}
      # Format: "speciesA:speciesB". Repeat this property to configure multiple pairs.
      adjacent-species-pairs: []
  betting:
    policy:
      # TODO(M03-economy): replace property source with admin-published betting policy.
      min-bet: ${BETTING_MIN_BET:100}
      rake-rate: ${BETTING_RAKE_RATE:0.10}
      house-budget: ${BETTING_HOUSE_BUDGET:2000}
      house-weight-up: ${BETTING_HOUSE_WEIGHT_UP:0.40}
      house-weight-flat: ${BETTING_HOUSE_WEIGHT_FLAT:0.30}
      house-weight-down: ${BETTING_HOUSE_WEIGHT_DOWN:0.30}
      open-time-utc: ${BETTING_OPEN_TIME_UTC:00:05}
      cutoff-time-utc: ${BETTING_CUTOFF_TIME_UTC:23:30}
      history-default-limit: ${BETTING_HISTORY_DEFAULT_LIMIT:20}
      history-max-limit: ${BETTING_HISTORY_MAX_LIMIT:100}
      dead-zone-threshold: ${BETTING_DEAD_ZONE_THRESHOLD:5}
      moon-doom-sigma-multiplier: ${BETTING_MOON_DOOM_SIGMA_MULTIPLIER:1.2}
      policy-version: ${BETTING_POLICY_VERSION:betting-policy-property-v1}
      policy-source: ${BETTING_POLICY_SOURCE:property}
    settlement:
      # Keep scheduler off by default for safer local rollout.
      enabled: ${BETTING_SETTLEMENT_ENABLED:false}
      # Default runs after UTC 00:00 so Arena daily snapshot jobs can finish first.
      orchestrator-cron: ${BETTING_SETTLEMENT_ORCHESTRATOR_CRON:30 0 0 * * *}
      # Retry/fallback controls (default: 3 retries + exponential backoff).
      retry-max-attempts: ${BETTING_SETTLEMENT_RETRY_MAX_ATTEMPTS:3}
      retry-initial-backoff-ms: ${BETTING_SETTLEMENT_RETRY_INITIAL_BACKOFF_MS:0}
      retry-max-backoff-ms: ${BETTING_SETTLEMENT_RETRY_MAX_BACKOFF_MS:2000}
      retry-deadline-seconds: ${BETTING_SETTLEMENT_RETRY_DEADLINE_SECONDS:300}
  specimen:
    contract:
      watchlist-max-items: 200
      watchlist-default-limit: 20
      watchlist-max-limit: 50
      admin-idempotency-ttl: 24h
      tag-config-version: tagcfg_2026_02_10_01
      published-match-profile-version: ${SPECIMEN_MATCH_PROFILE_VERSION:v1.0.0}
      match-species-dimension-key: ${ARENA_SPECIES_DIMENSION_KEY:species}
      match-diagnosis-dimension-key: ${ARENA_DIAGNOSIS_DIMENSION_KEY:diagnosis}
      # TODO(M01/M03): move to admin-published arena runtime policy once policy center is ready.
      default-elo: ${ARENA_INITIAL_ELO:1500}
  security:
    token:
      secret: change-this-in-prod-change-this-in-prod
      issuer: wtf-repo-backend
      ttl: 1h
      admin-ttl: ${ADMIN_TOKEN_TTL:8h}
      blacklist-key-prefix: ${ADMIN_TOKEN_BLACKLIST_PREFIX:security:token:blacklist}
